name: Feature request
description: Propose an improvement before implementation begins
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Explain the administration problem and
        desired outcome rather than only prescribing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What Samba administration task is difficult or unsafe today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected user workflow and result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility considerations
      description: Note permissions, rollback, supported platforms, or Samba variants involved.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find an equivalent request.
          required: true
        - label: This request contains no credentials or private system information.
          required: true
