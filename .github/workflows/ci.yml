name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=sambactl
      - run: python -m build
  debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools
      - run: dpkg-buildpackage -us -uc -b
      - name: Collect Debian package
        run: |
          shopt -s nullglob
          packages=(../*.deb)
          (( ${#packages[@]} > 0 ))
          mkdir -p artifacts
          cp -- "${packages[@]}" artifacts/
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: sambactl-debian-package
          path: artifacts/*.deb
          if-no-files-found: error
