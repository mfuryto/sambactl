name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and build dependencies
        run: |
          python -m pip install -e '.[dev]'
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools

      - name: Test release source
        run: |
          ruff check .
          pytest --cov=sambactl
          python -m build

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Verify Debian package exists
        run: test -n "$(find .. -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sambactl-debian-package
          path: ../*.deb
          if-no-files-found: error

      - name: Attach Debian package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ../*.deb
          fail_on_unmatched_files: true
          generate_release_notes: true
