[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sambactl"
version = "0.1.0"
description = "Safe, menu-driven Samba administration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Sambactl contributors"}]
dependencies = ["prompt-toolkit>=3.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
sambactl = "sambactl.cli:main"

[project.optional-dependencies]
dev = ["build>=1", "pytest>=7", "pytest-cov>=4", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["sambactl*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
